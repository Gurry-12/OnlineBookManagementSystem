<svg width="300" height="400" viewBox="0 0 300 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Book Background -->
  <rect width="300" height="400" fill="#f8f9fa" stroke="#dee2e6" stroke-width="2" rx="8"/>
  
  <!-- Book Spine Shadow -->
  <rect x="0" y="0" width="20" height="400" fill="#e9ecef" rx="8 0 0 8"/>
  
  <!-- Title Area -->
  <rect x="30" y="40" width="240" height="80" fill="#6366f1" rx="4"/>
  
  <!-- Title Text -->
  <text x="150" y="70" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="18" font-weight="bold">DEMO BOOK</text>
  <text x="150" y="95" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14">Sample Title</text>
  
  <!-- Author Area -->
  <text x="150" y="140" text-anchor="middle" fill="#6c757d" font-family="Arial, sans-serif" font-size="12">by Demo Author</text>
  
  <!-- Book Icon -->
  <g transform="translate(125, 180)">
    <rect width="50" height="60" fill="#495057" rx="3"/>
    <rect x="5" y="5" width="40" height="50" fill="#f8f9fa" rx="2"/>
    <line x1="10" y1="15" x2="40" y2="15" stroke="#6c757d" stroke-width="1"/>
    <line x1="10" y1="20" x2="35" y2="20" stroke="#6c757d" stroke-width="1"/>
    <line x1="10" y1="25" x2="40" y2="25" stroke="#6c757d" stroke-width="1"/>
    <line x1="10" y1="30" x2="30" y2="30" stroke="#6c757d" stroke-width="1"/>
  </g>
  
  <!-- Publisher Info -->
