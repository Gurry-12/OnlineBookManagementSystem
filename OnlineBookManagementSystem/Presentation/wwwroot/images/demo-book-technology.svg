<svg width="300" height="400" viewBox="0 0 300 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Book Background -->
  <rect width="300" height="400" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="2" rx="8"/>
  
  <!-- Book Spine Shadow -->
  <rect x="0" y="0" width="20" height="400" fill="#bae6fd" rx="8 0 0 8"/>
  
  <!-- Title Area -->
  <rect x="30" y="40" width="240" height="80" fill="#0284c7" rx="4"/>
  
  <!-- Title Text -->
  <text x="150" y="70" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="18" font-weight="bold">TECHNOLOGY</text>
  <text x="150" y="95" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14">Programming Guide</text>
  
  <!-- Author Area -->
  <text x="150" y="140" text-anchor="middle" fill="#0c4a6e" font-family="Arial, sans-serif" font-size="12">by Tech Expert</text>
  
  <!-- Tech Icon -->
  <g transform="translate(150, 200)">
    <rect x="-30" y="-20" width="60" height="40" fill="#0ea5e9" rx="4"/>
    <rect x="-25" y="-15" width="50" height="30" fill="#f0f9ff" rx="2"/>
    <circle cx="-15" cy="-5" r="2" fill="#0284c7"/>
    <circle cx="0" cy="-5" r="2" fill="#0284c7"/>
    <circle cx="15" cy="-5" r="2" fill="#0284c7"/>
    <rect x="-20" y="5" width="40" height="2" fill="#0284c7"/>
    <rect x="-15" y="10" width="30" height="2" fill="#0284c7"/>
  </g>
  
  <!-- Genre Label -->
  <text x="150" y="280" text-anchor="middle" fill="#0c4a6e" font-family="Arial, sans-serif" font-size="10">TECHNOLOGY • PROGRAMMING</text>
  
  <!-- Publisher Info -->
  <text x="150" y="320" text-anchor="middle" fill="#0c4a6e" font-family="Arial, sans-serif" font-size="10">WHISPERING PAGES</text>
  
  <!-- ISBN -->
  <text x="150" y="375" text-anchor="middle" fill="#0c4a6e" font-family="Arial, sans-serif" font-size="8">ISBN: 978-0-222222-22-2</text>
</svg>