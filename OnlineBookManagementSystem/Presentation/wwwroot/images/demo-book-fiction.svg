<svg width="300" height="400" viewBox="0 0 300 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Book Background -->
  <rect width="300" height="400" fill="#fef7f0" stroke="#f97316" stroke-width="2" rx="8"/>
  
  <!-- Book Spine Shadow -->
  <rect x="0" y="0" width="20" height="400" fill="#fed7aa" rx="8 0 0 8"/>
  
  <!-- Title Area -->
  <rect x="30" y="40" width="240" height="80" fill="#ea580c" rx="4"/>
  
  <!-- Title Text -->
  <text x="150" y="70" text-anchor="middle" fill="white" font-family="Georgia, serif" font-size="18" font-weight="bold">FICTION</text>
  <text x="150" y="95" text-anchor="middle" fill="white" font-family="Georgia, serif" font-size="14">Classic Novel</text>
  
  <!-- Author Area -->
  <text x="150" y="140" text-anchor="middle" fill="#9a3412" font-family="Georgia, serif" font-size="12">by Literary Author</text>
  
  <!-- Decorative Element -->
  <g transform="translate(150, 180)">
    <circle r="40" fill="#f97316" opacity="0.2"/>
    <path d="M-20,-10 Q0,-30 20,-10 Q0,10 -20,-10" fill="#ea580c"/>
  </g>
  
  <!-- Genre Label -->
  <text x="150" y="280" text-anchor="middle" fill="#9a3412" font-family="Georgia, serif" font-size="10">FICTION • LITERATURE</text>
  
  <!-- Publisher Info -->
  <text x="150" y="320" text-anchor="middle" fill="#9a3412" font-family="Georgia, serif" font-size="10">WHISPERING PAGES</text>
  
  <!-- ISBN -->
  <text x="150" y="375" text-anchor="middle" fill="#9a3412" font-family="Arial, sans-serif" font-size="8">ISBN: 978-0-111111-11-1</text>
</svg>