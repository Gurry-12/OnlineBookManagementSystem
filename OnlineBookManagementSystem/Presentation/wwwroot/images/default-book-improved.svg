<svg width="300" height="400" viewBox="0 0 300 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Book Background -->
  <rect width="300" height="400" fill="#ffffff" stroke="#e5e7eb" stroke-width="2" rx="8"/>
  
  <!-- Book Spine Shadow -->
  <rect x="0" y="0" width="20" height="400" fill="#f3f4f6" rx="8 0 0 8"/>
  
  <!-- Header Area -->
  <rect x="30" y="40" width="240" height="60" fill="#6366f1" rx="4"/>
  
  <!-- Logo/Brand Area -->
  <g transform="translate(150, 70)">
    <circle r="15" fill="white" opacity="0.9"/>
    <path d="M-8,-5 L-3,0 L-8,5 M3,-5 L8,0 L3,5" stroke="#6366f1" stroke-width="2" fill="none"/>
  </g>
  
  <!-- Title Placeholder -->
  <rect x="50" y="130" width="200" height="20" fill="#d1d5db" rx="2"/>
  <rect x="50" y="160" width="150" height="15" fill="#e5e7eb" rx="2"/>
  
  <!-- Author Placeholder -->
  <rect x="50" y="190" width="100" height="12" fill="#f3f4f6" rx="2"/>
  
  <!-- Content Lines -->
  <rect x="50" y="230" width="200" height="3" fill="#f3f4f6" rx="1"/>
  <rect x="50" y="240" width="180" height="3" fill="#f3f4f6" rx="1"/>
  <rect x="50" y="250" width="190" height="3" fill="#f3f4f6" rx="1"/>
  <rect x="50" y="260" width="160" height="3" fill="#f3f4f6" rx="1"/>
  <rect x="50" y="270" width="200" height="3" fill="#f3f4f6" rx="1"/>
  <rect x="50" y="280" width="170" height="3" fill="#f3f4f6" rx="1"/>
  
  <!-- Publisher Area -->
  <text x="150" y="330" text-anchor="middle" fill="#9ca3af" font-family="Arial, sans-serif" font-size="12" font-weight="500">WHISPERING PAGES</text>
  
  <!-- Bottom Border -->
  <rect x="30" y="350" width="240" height="2" fill="#6366f1" rx="1"/>
  
  <!-- ISBN Placeholder -->
  <rect x="50" y="370" width="120" height="8" fill="#f3f4f6" rx="1"/>
</svg>