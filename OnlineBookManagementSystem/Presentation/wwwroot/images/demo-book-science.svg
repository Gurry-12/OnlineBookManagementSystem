<svg width="300" height="400" viewBox="0 0 300 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Book Background -->
  <rect width="300" height="400" fill="#f0fdf4" stroke="#22c55e" stroke-width="2" rx="8"/>
  
  <!-- Book Spine Shadow -->
  <rect x="0" y="0" width="20" height="400" fill="#bbf7d0" rx="8 0 0 8"/>
  
  <!-- Title Area -->
  <rect x="30" y="40" width="240" height="80" fill="#16a34a" rx="4"/>
  
  <!-- Title Text -->
  <text x="150" y="70" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="18" font-weight="bold">SCIENCE</text>
  <text x="150" y="95" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14">Research & Discovery</text>
  
  <!-- Author Area -->
  <text x="150" y="140" text-anchor="middle" fill="#15803d" font-family="Arial, sans-serif" font-size="12">by Scientist</text>
  
  <!-- Science Icon - Atom -->
  <g transform="translate(150, 200)">
    <circle r="30" fill="none" stroke="#22c55e" stroke-width="2" opacity="0.5"/>
    <ellipse rx="35" ry="15" fill="none" stroke="#16a34a" stroke-width="2" transform="rotate(45)"/>
    <ellipse rx="35" ry="15" fill="none" stroke="#16a34a" stroke-width="2" transform="rotate(-45)"/>
    <circle r="4" fill="#16a34a"/>
  </g>
  
  <!-- Genre Label -->
  <text x="150" y="280" text-anchor="middle" fill="#15803d" font-family="Arial, sans-serif" font-size="10">SCIENCE • RESEARCH</text>
  
  <!-- Publisher Info -->
  <text x="150" y="320" text-anchor="middle" fill="#15803d" font-family="Arial, sans-serif" font-size="10">WHISPERING PAGES</text>
  
  <!-- ISBN -->
  <text x="150" y="375" text-anchor="middle" fill="#15803d" font-family="Arial, sans-serif" font-size="8">ISBN: 978-0-333333-33-3</text>
</svg>